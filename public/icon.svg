<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="racketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Padel Racket Head -->
  <g transform="translate(256, 230) rotate(-25) translate(-256, -230)">
    <!-- Racket Rim -->
    <path d="M 256,70 C 330,70 380,120 380,210 C 380,270 340,320 286,345 L 286,410 C 286,420 278,428 268,428 L 244,428 C 234,428 226,420 226,410 L 226,345 C 172,320 132,270 132,210 C 132,120 182,70 256,70 Z" 
          fill="#1e293b" stroke="url(#racketGrad)" stroke-width="16" />
    
    <!-- Grip wrapping lines -->
    <line x1="226" y1="365" x2="286" y2="365" stroke="#334155" stroke-width="4"/>
    <line x1="226" y1="385" x2="286" y2="385" stroke="#334155" stroke-width="4"/>
    <line x1="226" y1="405" x2="286" y2="405" stroke="#334155" stroke-width="4"/>

    <!-- Padel holes grid -->
    <g fill="#0b0f19" stroke="#10b981" stroke-width="2" stroke-opacity="0.5">
      <!-- Center ring -->
      <circle cx="256" cy="190" r="9"/>
      <circle cx="226" cy="190" r="9"/>
      <circle cx="286" cy="190" r="9"/>
      <circle cx="256" cy="160" r="9"/>
      <circle cx="256" cy="220" r="9"/>

      <circle cx="226" cy="160" r="8"/>
      <circle cx="286" cy="160" r="8"/>
      <circle cx="226" cy="220" r="8"/>
      <circle cx="286" cy="220" r="8"/>

      <circle cx="196" cy="190" r="8"/>
      <circle cx="316" cy="190" r="8"/>
      <circle cx="256" cy="130" r="8"/>
      <circle cx="256" cy="250" r="8"/>

      <circle cx="196" cy="160" r="7"/>
      <circle cx="316" cy="160" r="7"/>
      <circle cx="196" cy="220" r="7"/>
      <circle cx="316" cy="220" r="7"/>

      <circle cx="226" cy="130" r="7"/>
      <circle cx="286" cy="130" r="7"/>
      <circle cx="226" cy="250" r="7"/>
      <circle cx="286" cy="250" r="7"/>
    </g>
  </g>

  <!-- Padel Ball with motion glow -->
  <circle cx="370" cy="140" r="44" fill="url(#ballGrad)" filter="url(#glow)"/>
  <path d="M 345,116 C 362,132 362,154 345,168" fill="none" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
  <path d="M 395,116 C 378,132 378,154 395,168" fill="none" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
</svg>
